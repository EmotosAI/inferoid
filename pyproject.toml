[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inferoid"
version = "0.2.0"
description = "Keep coding when Claude hits its limit: a free local model with a clean handover"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "Inferoid contributors"}]
dependencies = []

[project.scripts]
inferoid = "inferoid.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
inferoid = ["data/*.json"]

[tool.uv]
# Rebuild when the code changes, not only when pyproject.toml does (otherwise `uv tool install --force .` reuses a stale build).
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*.py" }, { file = "src/**/*.json" }]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
